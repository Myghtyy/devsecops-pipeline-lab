name: DevSecOps-Security-Pipeline

on: [push]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install Dependencies
        run: npm install --package-lock=false --omit=dev

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Build Docker Image
        run: docker build -t my-app:latest .

      - name: Generate HTML Security Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:latest'
          format: 'template'
          template: '@/contrib/html.tpl'
          output: 'security-report.html'
          exit-code: '0'
          
      - name: Convert HTML to PDF
        uses: psf/black-action@master
        with:
          html_file: 'security-report.html'
          pdf_file: 'Sneh-Security-Audit.pdf'

      - name: Upload PDF Report
        uses: actions/upload-artifact@v4
        with:
          name: Professional-Security-Audit
          path: Sneh-Security-Audit.pdf

      - name: Final Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:latest'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Notify Discord on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"content": "🚨 **Security Build Failed!** High-severity vulnerabilities detected. Check the **Summary** tab in GitHub Actions for details."}' \
          ${{ secrets.DISCORD_WEBHOOK }}
