name: DevSecOps-Security-Pipeline

on: [push]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install Dependencies
        run: npm install --package-lock=false --omit=dev

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Build Docker Image
        run: docker build -t my-app:latest .

      - name: Run Trivy vulnerability scanner (Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:latest'
          format: 'template'
          template: '@/contrib/html.tpl'
          output: 'security-report.html'
          exit-code: '0'

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: security-report.html

      - name: Final Security Gate
        
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 my-app:latest

      - name: Notify Discord on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "embeds": [{
              "title": "🚨 Security Build Failed",
              "description": "High or Critical vulnerabilities were detected in the latest push. Deployment has been blocked.",
              "color": 15158332,
              "fields": [
                { "name": "Repository", "value": "${{ github.repository }}", "inline": true },
                { "name": "Commit", "value": "${{ github.sha }}", "inline": true }
              ]
            }]
          }' ${{ secrets.DISCORD_WEBHOOK }}
